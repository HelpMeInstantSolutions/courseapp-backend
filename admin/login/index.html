<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | CourseApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        .brand-header {
            background: #4338ca;
            color: white;
            padding: 30px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-header">
            <i class="bi bi-shield-lock-fill fs-1"></i>
            <h4 class="fw-bold mt-2 mb-0">CourseApp Admin</h4>
            <small class="text-white-50">courseapp.mybhiwani.in</small>
        </div>
        <div class="p-4">
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" required value="admin">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control" id="password" required value="admin">
                    </div>
                    <small class="text-muted">Default: <strong>admin</strong> / <strong>admin</strong></small>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="btnSubmit">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Admin Panel
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script>
        // Check if already logged in
        if (localStorage.getItem('admin_token')) {
            window.location.href = '../';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerText = 'Verifying...';

            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();

            try {
                const res = await fetch('../../api/admin_crud.php?action=login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();
                if (data.status) {
                    localStorage.setItem('admin_token', 'true');
                    localStorage.setItem('admin_name', data.data.name);
                    Toastify({
                        text: "Login Successful! Redirecting...",
                        duration: 1500,
                        style: { background: "linear-gradient(to right, #00b09b, #96c93d)" }
                    }).showToast();
                    setTimeout(() => { window.location.href = '../'; }, 1000);
                } else {
                    Toastify({
                        text: data.message,
                        duration: 3500,
                        style: { background: "linear-gradient(to right, #ff5f6d, #ffc371)" }
                    }).showToast();
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Admin Panel';
                }
            } catch (err) {
                Toastify({ text: "Connection error", duration: 3000 }).showToast();
                btn.disabled = false;
                btn.innerText = 'Sign In';
            }
        }
    </script>
</body>
</html>
