<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Students | CourseApp Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <style>
        :root { --sidebar-width: 270px; }
        body { background-color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
        .sidebar { width: var(--sidebar-width); height: 100vh; position: fixed; top: 0; left: 0; background: #0f172a; color: #f1f5f9; z-index: 1000; box-shadow: 4px 0 10px rgba(0,0,0,0.1); }
        .main-content { margin-left: var(--sidebar-width); padding: 28px; min-height: 100vh; }
        .nav-link { color: #94a3b8; border-radius: 10px; padding: 12px 18px; margin: 4px 12px; font-weight: 500; text-decoration: none; display: flex; align-items: center; transition: all 0.2s; }
        .nav-link:hover, .nav-link.active { color: #ffffff; background: #1e293b; }
        .nav-link.active { background: #4f46e5; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35); }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); }
        .avatar-circle { width: 42px; height: 42px; border-radius: 50%; background: #e0e7ff; color: #4338ca; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>
    <script>
        if (!localStorage.getItem('admin_token')) window.location.href = '../login/';
    </script>

    <!-- Sidebar -->
    <div class="sidebar d-flex flex-column p-3">
        <div class="d-flex align-items-center mb-4 px-2 pt-2">
            <div class="bg-primary p-2 rounded-3 text-white me-3 shadow">
                <i class="bi bi-play-circle-fill fs-4"></i>
            </div>
            <div>
                <h5 class="mb-0 text-white fw-bold">CourseApp</h5>
                <small class="text-secondary">courseapp.mybhiwani.in</small>
            </div>
        </div>
        <hr class="text-secondary my-2">
        <ul class="nav flex-column mb-auto">
            <li><a href="../" class="nav-link"><i class="bi bi-grid-fill me-3 fs-5"></i> Dashboard</a></li>
            <li><a href="../courses/" class="nav-link"><i class="bi bi-collection-play-fill me-3 fs-5"></i> Manage Courses</a></li>
            <li><a href="../videos/" class="nav-link"><i class="bi bi-film me-3 fs-5"></i> Dailymotion Lessons</a></li>
            <li><a href="../users/" class="nav-link active"><i class="bi bi-people-fill me-3 fs-5"></i> Students / Users</a></li>
        </ul>
        <hr class="text-secondary">
        <div class="px-2">
            <button class="btn btn-outline-danger w-100 btn-sm py-2" onclick="logoutAdmin()">
                <i class="bi bi-box-arrow-right me-1"></i> Logout Admin
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded-4 shadow-sm">
            <div>
                <h4 class="mb-1 fw-bold text-dark">Registered App Users & Students</h4>
                <small class="text-muted">Live registrations from Insight Course App (Android)</small>
            </div>
            <button class="btn btn-outline-primary rounded-pill px-3" onclick="loadUsers()">
                <i class="bi bi-arrow-clockwise me-1"></i> Refresh Users
            </button>
        </div>

        <div class="card bg-white p-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Student</th>
                            <th>Email Address</th>
                            <th>Phone / Contact</th>
                            <th>Status</th>
                            <th>Joined Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr><td colspan="7" class="text-center py-4">Loading registered students...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script>
        const API_BASE = '../../api';

        function showToast(text, type = 'success') {
            const colors = {
                success: "linear-gradient(to right, #00b09b, #96c93d)",
                error: "linear-gradient(to right, #ff5f6d, #ffc371)",
                info: "linear-gradient(to right, #2193b0, #6dd5ed)"
            };
            Toastify({
                text: text, duration: 3000, gravity: "top", position: "right",
                style: { background: colors[type] || colors.info, borderRadius: "8px" }
            }).showToast();
        }

        function logoutAdmin() {
            localStorage.removeItem('admin_token');
            window.location.href = '../login/';
        }

        async function loadUsers() {
            try {
                const res = await fetch(`${API_BASE}/admin_crud.php?action=list_users`);
                const json = await res.json();
                const tbody = document.getElementById('usersTableBody');
                
                if (json.status && json.data.length > 0) {
                    tbody.innerHTML = json.data.map((u, i) => `
                        <tr>
                            <td>${i + 1}</td>
                            <td>
                                <div class="d-flex align-items-center">
                                    <div class="avatar-circle me-3">${u.name ? u.name.charAt(0).toUpperCase() : 'S'}</div>
                                    <div>
                                        <div class="fw-bold text-dark">${u.name || 'Unnamed Student'}</div>
                                        <small class="text-muted">UID: #${u.id}</small>
                                    </div>
                                </div>
                            </td>
                            <td><span class="text-primary fw-medium"><i class="bi bi-envelope me-1"></i>${u.email}</span></td>
                            <td>${u.phone ? '<i class="bi bi-telephone me-1 text-muted"></i>' + u.phone : '<span class="text-muted">Not provided</span>'}</td>
                            <td><span class="badge bg-success bg-opacity-10 text-success px-3 py-2 rounded-pill">● Active Student</span></td>
                            <td><small class="text-muted">${u.created_at || 'Recently'}</small></td>
                            <td>
                                <button class="btn btn-sm btn-outline-danger rounded-circle p-2" title="Delete Account" onclick="deleteUser(${u.id})">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = `<tr><td colspan="7" class="text-center py-5 text-muted"><i class="bi bi-people fs-1 d-block mb-2 text-secondary"></i>No students registered yet. Students registering in Android App will appear here!</td></tr>`;
                }
            } catch(e) {
                showToast("Failed to load users", "error");
            }
        }

        async function deleteUser(id) {
            if (!confirm("Are you sure you want to delete this student account?")) return;
            try {
                const res = await fetch(`${API_BASE}/admin_crud.php?action=delete_user`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });
                const d = await res.json();
                if (d.status) {
                    showToast(d.message, 'success');
                    loadUsers();
                } else {
                    showToast(d.message, 'error');
                }
            } catch(e) { showToast("Error deleting student", "error"); }
        }

        window.addEventListener('DOMContentLoaded', loadUsers);
    </script>
</body>
</html>
