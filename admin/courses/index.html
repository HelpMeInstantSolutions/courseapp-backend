<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Courses | CourseApp Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <style>
        :root { --sidebar-width: 260px; }
        body { background-color: #f8fafc; font-family: system-ui, sans-serif; }
        .sidebar { width: var(--sidebar-width); height: 100vh; position: fixed; top: 0; left: 0; background: #0f172a; color: #f1f5f9; z-index: 1000; }
        .main-content { margin-left: var(--sidebar-width); padding: 24px; min-height: 100vh; }
        .nav-link { color: #94a3b8; border-radius: 8px; padding: 10px 16px; margin: 4px 12px; font-weight: 500; text-decoration: none; display: block; }
        .nav-link:hover, .nav-link.active { color: #ffffff; background: #1e293b; }
        .nav-link.active { background: #4338ca; }
        .card { border: 1px solid #e2e8f0; border-radius: 12px; }
    </style>
</head>
<body>
    <script>
        if (!localStorage.getItem('admin_token')) window.location.href = '../login/';
    </script>

    <!-- Sidebar -->
    <div class="sidebar d-flex flex-column p-3">
        <div class="d-flex align-items-center mb-4 px-2">
            <i class="bi bi-play-circle-fill text-primary fs-3 me-2"></i>
            <div>
                <h5 class="mb-0 text-white fw-bold">CourseApp</h5>
                <small class="text-secondary">courseapp.mybhiwani.in</small>
            </div>
        </div>
        <hr class="text-secondary my-2">
        <ul class="nav flex-column mb-auto">
            <li><a href="../" class="nav-link"><i class="bi bi-grid-fill me-2"></i> Dashboard</a></li>
            <li><a href="../courses/" class="nav-link active"><i class="bi bi-collection-play-fill me-2"></i> Manage Courses</a></li>
            <li><a href="../videos/" class="nav-link"><i class="bi bi-film me-2"></i> Dailymotion Lessons</a></li>
        </ul>
        <hr class="text-secondary">
        <div class="px-2">
            <button class="btn btn-outline-danger w-100 btn-sm" onclick="logoutAdmin()">
                <i class="bi bi-box-arrow-right me-1"></i> Logout
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded-3 shadow-sm border">
            <div>
                <h4 class="mb-0 fw-bold">Manage Courses</h4>
                <small class="text-muted">Direct Link: /admin/courses/</small>
            </div>
            <button class="btn btn-primary" onclick="openNewCourseModal()">
                <i class="bi bi-plus-circle me-1"></i> Add Course
            </button>
        </div>

        <div class="card bg-white p-3">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Thumbnail</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Total Lessons</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="coursesTableBody">
                        <tr><td colspan="7" class="text-center py-4">Loading courses...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal: Add Course -->
    <div class="modal fade" id="courseModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="courseForm" onsubmit="handleSaveCourse(event)">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold">Add New Course</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="courseId" value="0">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Course Title *</label>
                            <input type="text" class="form-control" id="courseTitle" required placeholder="Course name">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Category</label>
                            <select class="form-select" id="courseCategory"></select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Price (₹)</label>
                            <input type="number" step="0.01" class="form-control" id="coursePrice" value="0.00">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Thumbnail URL</label>
                            <input type="url" class="form-control" id="courseThumbnail" placeholder="https://...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Description</label>
                            <textarea class="form-control" id="courseDesc" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Course</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script>
        const API_BASE = '../../api';
        const courseModal = new bootstrap.Modal(document.getElementById('courseModal'));

        function showToast(text, type = 'success') {
            const colors = {
                success: "linear-gradient(to right, #00b09b, #96c93d)",
                error: "linear-gradient(to right, #ff5f6d, #ffc371)",
                info: "linear-gradient(to right, #2193b0, #6dd5ed)"
            };
            Toastify({
                text: text, duration: 3000, gravity: "top", position: "right",
                style: { background: colors[type] || colors.info, borderRadius: "8px" }
            }).showToast();
        }

        function logoutAdmin() {
            localStorage.removeItem('admin_token');
            window.location.href = '../login/';
        }

        async function loadCategories() {
            try {
                const res = await fetch(`${API_BASE}/courses.php?action=categories`);
                const json = await res.json();
                if (json.status) {
                    document.getElementById('courseCategory').innerHTML = json.data.map(c => `<option value="${c.id}">${c.title}</option>`).join('');
                }
            } catch(e) {}
        }

        async function loadCourses() {
            try {
                const res = await fetch(`${API_BASE}/courses.php?action=list`);
                const json = await res.json();
                const tbody = document.getElementById('coursesTableBody');
                if (json.status && json.data.length > 0) {
                    tbody.innerHTML = json.data.map((c, i) => `
                        <tr>
                            <td>${i + 1}</td>
                            <td><img src="${c.thumbnail || 'https://via.placeholder.com/80'}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 6px;"></td>
                            <td><div class="fw-bold">${c.title}</div></td>
                            <td><span class="badge bg-secondary">${c.category_name || 'General'}</span></td>
                            <td class="fw-bold text-success">${c.price > 0 ? '₹' + c.price : '<span class="badge bg-success">Free</span>'}</td>
                            <td><span class="badge bg-primary">${c.total_videos || 0} Lessons</span></td>
                            <td><button class="btn btn-sm btn-outline-danger" onclick="deleteCourse(${c.id})"><i class="bi bi-trash"></i></button></td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4">No courses created yet.</td></tr>`;
                }
            } catch(e) { showToast("Failed to fetch courses", "error"); }
        }

        function openNewCourseModal() {
            document.getElementById('courseForm').reset();
            document.getElementById('courseId').value = "0";
            courseModal.show();
        }

        async function handleSaveCourse(e) {
            e.preventDefault();
            const payload = {
                id: document.getElementById('courseId').value,
                title: document.getElementById('courseTitle').value,
                category_id: document.getElementById('courseCategory').value,
                price: document.getElementById('coursePrice').value,
                thumbnail: document.getElementById('courseThumbnail').value,
                description: document.getElementById('courseDesc').value
            };
            try {
                const res = await fetch(`${API_BASE}/admin_crud.php?action=save_course`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const d = await res.json();
                if (d.status) {
                    showToast(d.message, 'success');
                    courseModal.hide();
                    loadCourses();
                } else { showToast(d.message, 'error'); }
            } catch(err) { showToast("Error saving course", "error"); }
        }

        async function deleteCourse(id) {
            if (!confirm("Are you sure?")) return;
            const res = await fetch(`${API_BASE}/admin_crud.php?action=delete_course`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id })
            });
            const d = await res.json();
            if (d.status) { showToast(d.message, 'success'); loadCourses(); }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadCategories();
            loadCourses();
        });
    </script>
</body>
</html>
